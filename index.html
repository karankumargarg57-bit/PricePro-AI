<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>अल्ट्रा-प्रो मैक्स स्मार्ट जीएसटी इनवॉइस</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --primary-bg: #e0e7ff;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --accent-green: #059669;
            --accent-red: #dc2626;
            --radius-lg: 24px;
            --radius-md: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .invoice-wrapper {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 850px;
            padding: 24px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .top-bar {
            background: var(--primary-bg);
            border: 1px solid #c7d2fe;
            border-radius: var(--radius-md);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-bar input {
            border: 1px solid #a5b4fc;
            border-radius: 8px;
            padding: 6px 10px;
            font-weight: 700;
            color: var(--primary-dark);
            outline: none;
            background: #fff;
        }

        .biz-header {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px dashed var(--border-color);
        }

        .biz-inputs input {
            width: 100%;
            border: none;
            font-size: 22px;
            font-weight: 800;
            color: var(--primary-dark);
            outline: none;
            background: transparent;
        }

        .biz-inputs textarea {
            width: 100%;
            border: none;
            font-size: 12px;
            color: var(--text-muted);
            outline: none;
            background: transparent;
            resize: none;
        }

        .section-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin: 20px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cust-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .field-group { display: flex; flex-direction: column; gap: 5px; }
        .field-group label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .field-group input, .field-group select {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            background: #fff;
            transition: all 0.2s;
        }
        .field-group input:focus, .field-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        /* Item Row Style */
        .item-row {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }

        .item-main-grid {
            display: grid;
            grid-template-columns: 30px 1fr 36px;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
        }

        .item-calc-grid {
            display: grid;
            grid-template-columns: 1fr 1.1fr 1.2fr 1fr;
            gap: 8px;
        }

        .btn-del {
            background: #fee2e2;
            color: var(--accent-red);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .btn-del:hover { background: #fecaca; }

        .btn-add-item {
            background: #fff;
            border: 2px dashed var(--primary);
            color: var(--primary);
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-md);
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-add-item:hover { background: var(--primary-bg); }

        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .payment-box, .summary-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
        }

        .pay-option-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .pay-badge {
            border: 1px solid var(--border-color);
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .sum-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
        .sum-row.grand-total {
            font-size: 18px;
            color: var(--primary-dark);
            border-top: 2px solid var(--border-color);
            padding-top: 12px;
            margin-top: 10px;
        }
        .grand-price { color: var(--accent-green); font-size: 22px; font-weight: 800; }

        .action-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .btn-act {
            padding: 15px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }
        .btn-whatsapp { background: #059669; }
        .btn-whatsapp:hover { background: #047857; }
        .btn-print { background: var(--primary); }
        .btn-print:hover { background: var(--primary-dark); }

        @media (min-width: 700px) {
            body { padding: 30px; }
            .invoice-wrapper { padding: 40px; }
            .biz-header { grid-template-columns: 2fr 1fr; }
            .cust-card { grid-template-columns: 1fr 1fr; }
            .cust-card .full-width { grid-column: span 2; }
            .bottom-grid { grid-template-columns: 1.2fr 1fr; }
        }
    </style>
</head>
<body>

<div class="invoice-wrapper">

    <!-- Top Bar -->
    <div class="top-bar">
        <div>
            <label style="font-size:11px; font-weight:700; color:var(--primary-dark);">दिनांक (Date):</label>
            <input type="date" id="invDate">
        </div>
        <div style="font-size:14px; font-weight:800; color:var(--primary-dark);">
            <i class="fa-solid fa-receipt"></i> अल्ट्रा प्रो इनवॉइस
        </div>
    </div>

    <!-- Business Header -->
    <div class="biz-header">
        <div class="biz-inputs">
            <input type="text" id="bizName" value="आपकी दुकान / कंपनी का नाम">
            <textarea id="bizDetails" rows="2">पता: मेन मार्केट, शहर | मोबाइल: +91 9876543210 | GSTIN: 07AAAAA0000A1Z5</textarea>
        </div>
        <div style="text-align: right;">
            <label style="font-size:11px; font-weight:700; color:var(--text-muted);">बिल नंबर:</label>
            <input type="text" id="invNo" value="#INV-1001" style="width: 100px; padding:6px; text-align:center; border:1px solid var(--border-color); border-radius:6px; font-weight:700;">
        </div>
    </div>

    <!-- Customer Section -->
    <div class="section-label"><i class="fa-solid fa-user-tie"></i> ग्राहक विवरण (Customer Info)</div>
    <div class="cust-card">
        <div class="field-group">
            <label>ग्राहक का नाम</label>
            <input type="text" id="custName" placeholder="उदा. राहुल कुमार">
        </div>
        <div class="field-group">
            <label>मोबाइल नंबर</label>
            <input type="tel" id="custMobile" placeholder="9876543210">
        </div>
        <div class="field-group full-width">
            <label>पता (Address)</label>
            <input type="text" id="custAddress" placeholder="मकान नं., गली, शहर, राज्य">
        </div>
    </div>

    <!-- Items List Section -->
    <div class="section-label"><i class="fa-solid fa-boxes-stacked"></i> उत्पाद सूची & ऑटो-जीएसटी इंजन</div>
    <div id="itemsContainer">
        <!-- Row 1 -->
        <div class="item-row">
            <div class="item-main-grid">
                <span class="sr-no" style="font-weight:800; font-size:13px; color:var(--primary);">1</span>
                <input type="text" class="item-name" placeholder="उत्पाद का नाम लिखें (उदा. Mobile, Shirt)" oninput="autoDetectGST(this)">
                <button class="btn-del" onclick="deleteItemRow(this)"><i class="fa-solid fa-trash-can"></i></button>
            </div>
            <div class="item-calc-grid">
                <div class="field-group">
                    <label>मात्रा (Qty)</label>
                    <input type="number" class="item-qty" value="1" min="1">
                </div>
                <div class="field-group">
                    <label>मूल्य / MRP (₹)</label>
                    <input type="number" class="item-price" placeholder="0.00">
                </div>
                <div class="field-group">
                    <label>प्राइस टाइप</label>
                    <select class="item-tax-type">
                        <option value="inclusive" selected>GST शामिल (MRP)</option>
                        <option value="exclusive">GST एक्स्ट्रा (प्लस)</option>
                    </select>
                </div>
                <div class="field-group">
                    <label>GST दर (%)</label>
                    <select class="item-tax-rate">
                        <option value="0">0% (Nil)</option>
                        <option value="5">5% GST</option>
                        <option value="12">12% GST</option>
                        <option value="18" selected>18% GST</option>
                        <option value="28">28% GST</option>
                    </select>
                </div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:12px; font-weight:700; color:var(--text-muted); border-top:1px solid #e2e8f0; padding-top:8px;">
                <span>मूल मूल्य: <span class="base-display" style="color:var(--text-main);">₹0.00</span></span>
                <span>GST: <span class="tax-amt-display" style="color:var(--accent-red);">₹0.00</span></span>
                <span>कुल: <span class="item-total-display" style="color:var(--primary); font-weight:800;">₹0.00</span></span>
            </div>
        </div>
    </div>

    <button class="btn-add-item" onclick="addItemRow()">
        <i class="fa-solid fa-circle-plus"></i> + और आइटम जोड़ें (Add Item)
    </button>

    <!-- Payment & Summary -->
    <div class="bottom-grid">
        <div class="payment-box">
            <div class="section-label" style="margin:0 0 8px 0;"><i class="fa-solid fa-wallet"></i> भुगतान का माध्यम</div>
            <div class="pay-option-group">
                <label class="pay-badge"><input type="radio" name="payMethod" value="UPI / QR" checked> UPI / QR</label>
                <label class="pay-badge"><input type="radio" name="payMethod" value="नकद (Cash)"> नकद (Cash)</label>
                <label class="pay-badge"><input type="radio" name="payMethod" value="कार्ड (Card)"> कार्ड (Card)</label>
                <label class="pay-badge"><input type="radio" name="payMethod" value="नेट बैंकिंग"> नेट बैंकिंग</label>
            </div>
        </div>

        <div class="summary-card">
            <div class="sum-row"><span>कुल मूल कीमत:</span><span id="subtotalDisplay">₹0.00</span></div>
            <div class="sum-row"><span>कुल जीएसटी (GST):</span><span id="taxDisplay">₹0.00</span></div>
            <div class="sum-row grand-total">
                <span>ग्रैंड टोटल:</span>
                <span class="grand-price" id="grandTotalDisplay">₹0.00</span>
            </div>
        </div>
    </div>

    <!-- Actions -->
    <div class="action-bar">
        <button class="btn-act btn-whatsapp" onclick="shareOnWhatsApp()">
            <i class="fa-brands fa-whatsapp" style="font-size:18px;"></i> WhatsApp शेयर करें
        </button>
        <button class="btn-act btn-print" onclick="window.print()">
            <i class="fa-solid fa-print" style="font-size:16px;"></i> प्रिंट / PDF
        </button>
    </div>

</div>

<script>
    document.getElementById('invDate').valueAsDate = new Date();

    // ग्लोबल लिसनर ताकि नया या पुराना कोई भी रो हो, तुरंत कैलकुलेट हो
    document.addEventListener('input', calculateInvoice);
    document.addEventListener('change', calculateInvoice);

    function autoDetectGST(inputElem) {
        const text = inputElem.value.toLowerCase();
        const row = inputElem.closest('.item-row');
        const taxRateSelect = row.querySelector('.item-tax-rate');

        if (text.includes('mobile') || text.includes('phone') || text.includes('मोबाइल') || text.includes('फोन') || text.includes('laptop') || text.includes('electronics')) {
            taxRateSelect.value = "18";
        } else if (text.includes('shirt') || text.includes('jeans') || text.includes('cloth') || text.includes('कपड़ा') || text.includes('शर्ट') || text.includes('pant') || text.includes('kurti')) {
            taxRateSelect.value = "5";
        } else if (text.includes('gold') || text.includes('sona') || text.includes('jewelry')) {
            taxRateSelect.value = "3";
        } else if (text.includes('luxury') || text.includes('car') || text.includes('ac')) {
            taxRateSelect.value = "28";
        }
        calculateInvoice();
    }

    function addItemRow() {
        const container = document.getElementById('itemsContainer');
        const count = container.children.length + 1;

        const div = document.createElement('div');
        div.className = 'item-row';
        div.innerHTML = `
            <div class="item-main-grid">
                <span class="sr-no" style="font-weight:800; font-size:13px; color:var(--primary);">${count}</span>
                <input type="text" class="item-name" placeholder="उत्पाद का नाम लिखें (उदा. Mobile, Shirt)" oninput="autoDetectGST(this)">
                <button class="btn-del" onclick="deleteItemRow(this)"><i class="fa-solid fa-trash-can"></i></button>
            </div>
            <div class="item-calc-grid">
                <div class="field-group">
                    <label>मात्रा (Qty)</label>
                    <input type="number" class="item-qty" value="1" min="1">
                </div>
                <div class="field-group">
                    <label>मूल्य / MRP (₹)</label>
                    <input type="number" class="item-price" placeholder="0.00">
                </div>
                <div class="field-group">
                    <label>प्राइस टाइप</label>
                    <select class="item-tax-type">
                        <option value="inclusive" selected>GST शामिल (MRP)</option>
                        <option value="exclusive">GST एक्स्ट्रा (प्लस)</option>
                    </select>
                </div>
                <div class="field-group">
                    <label>GST दर (%)</label>
                    <select class="item-tax-rate">
                        <option value="0">0% (Nil)</option>
                        <option value="5">5% GST</option>
                        <option value="12">12% GST</option>
                        <option value="18" selected>18% GST</option>
                        <option value="28">28% GST</option>
                    </select>
                </div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:12px; font-weight:700; color:var(--text-muted); border-top:1px solid #e2e8f0; padding-top:8px;">
                <span>मूल मूल्य: <span class="base-display" style="color:var(--text-main);">₹0.00</span></span>
                <span>GST: <span class="tax-amt-display" style="color:var(--accent-red);">₹0.00</span></span>
                <span>कुल: <span class="item-total-display" style="color:var(--primary); font-weight:800;">₹0.00</span></span>
            </div>
        `;
        container.appendChild(div);
        calculateInvoice();
    }

    function deleteItemRow(btn) {
        const container = document.getElementById('itemsContainer');
        if (container.children.length > 1) {
            btn.closest('.item-row').remove();
            updateSerialNumbers();
            calculateInvoice();
        } else {
            alert("कम से कम एक आइटम होना ज़रूरी है!");
        }
    }

    function updateSerialNumbers() {
        const rows = document.querySelectorAll('.item-row');
        rows.forEach((row, index) => {
            row.querySelector('.sr-no').innerText = index + 1;
        });
    }

    function calculateInvoice() {
        let grandSubtotal = 0;
        let grandTaxTotal = 0;

        const rows = document.querySelectorAll('.item-row');

        rows.forEach(row => {
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const enteredPrice = parseFloat(row.querySelector('.item-price').value) || 0;
            const taxType = row.querySelector('.item-tax-type').value;
            const taxRate = parseFloat(row.querySelector('.item-tax-rate').value) || 0;

            let basePrice = 0;
            let taxAmount = 0;
            let totalLineAmount = 0;

            if (taxType === 'inclusive') {
                const totalEntered = qty * enteredPrice;
                basePrice = totalEntered / (1 + (taxRate / 100));
                taxAmount = totalEntered - basePrice;
                totalLineAmount = totalEntered;
            } else {
                basePrice = qty * enteredPrice;
                taxAmount = (basePrice * taxRate) / 100;
                totalLineAmount = basePrice + ta
