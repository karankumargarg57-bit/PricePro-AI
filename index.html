<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>प्रोफेशनल प्राइस कैलकुलेटर</title>
    <!-- Google Fonts के माध्यम से 'Poppins' फोंट जोड़ा गया है -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* प्रोफेशनल लुक के लिए CSS */
        :root {
            --primary-color: #4a90e2; /* प्रोफेशनल ब्लू */
            --secondary-color: #357abd;
            --background-color: #f0f4f8;
            --text-color: #333;
            --white: #ffffff;
            --shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif; /* साफ़ और आधुनिक फोंट */
        }

        body {
            background-color: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-container {
            background-color: var(--white);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 450px;
            transition: transform 0.3s ease;
        }

        .calculator-container:hover {
            transform: translateY(-5px); /* हल्का होवर इफ़ेक्ट */
        }

        .calculator-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .calculator-header h2 {
            color: var(--primary-color);
            font-weight: 600;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .calculator-header p {
            color: #777;
            font-size: 14px;
            margin-top: 5px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 400;
            color: var(--text-color);
            font-size: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            color: var(--text-color);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(74, 144, 226, 0.2);
        }

        /* इनपुट बॉक्स में करेंसी सिंबल (₹) */
        .input-group.currency-input::before {
            content: '₹';
            position: absolute;
            left: 20px;
            top: 48px;
            color: #999;
            font-size: 16px;
        }

        .input-group.currency-input input {
            padding-left: 45px;
        }

        button.calculate-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
        }

        button.calculate-btn:hover {
            background-color: var(--secondary-color);
        }

        button.calculate-btn:active {
            transform: scale(0.98); /* क्लिक करने पर बटन दबेगा */
        }

        .result-display {
            margin-top: 30px;
            padding: 25px;
            background-color: #fbfdff;
            border: 2px dashed var(--primary-color);
            border-radius: 15px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .result-display.show {
            opacity: 1;
            transform: translateY(0);
        }

        .result-label {
            font-size: 16px;
            color: #777;
            margin-bottom: 10px;
        }

        .result-amount {
            font-size: 36px;
            font-weight: 600;
            color: var(--primary-color);
            word-wrap: break-word;
        }

        /* छोटी स्क्रीन के लिए रिस्पॉन्सिव डिज़ाइन */
        @media (max-width: 480px) {
            .calculator-container {
                padding: 30px 20px;
            }
            .calculator-header h2 {
                font-size: 24px;
            }
            .result-amount {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <div class="calculator-header">
        <h2>प्राइस कैलकुलेटर</h2>
        <p>अपनी कुल लागत का तुरंत अनुमान लगाएं</p>
    </div>
    
    <div class="input-group currency-input">
        <label for="price">प्रति यूनिट मूल्य (Price per Unit)</label>
        <input type="number" id="price" placeholder="उदा. 100" min="0">
    </div>

    <div class="input-group">
        <label for="quantity">मात्रा (Quantity)</label>
        <input type="number" id="quantity" placeholder="उदा. 5" min="1" value="1">
    </div>

    <div class="input-group">
        <label for="tax">टैक्स % (Tax Percentage)</label>
        <input type="number" id="tax" placeholder="उदा. 18" min="0" value="0">
    </div>

    <button class="calculate-btn" onclick="calculateTotal()">कुल कीमत की गणना करें</button>

    <div class="result-display" id="result-display">
        <div class="result-label">कुल देय राशि</div>
        <div class="result-amount" id="result-amount">₹0.00</div>
    </div>
</div>

<script>
    function calculateTotal() {
        // इनपुट वैल्यू प्राप्त करें
        const price = parseFloat(document.getElementById('price').value);
        const quantity = parseFloat(document.getElementById('quantity').value);
        const tax = parseFloat(document.getElementById('tax').value);

        // बेसिक वैलिडेशन
        if (isNaN(price) || price < 0 || isNaN(quantity) || quantity < 1 || isNaN(tax) || tax < 0) {
            alert("कृपया सभी फ़ील्ड में सही और सकारात्मक (positive) संख्याएं दर्ज करें।");
            return;
        }

        // गणना (Calculations)
        const subtotal = price * quantity;
        const taxAmount = (subtotal * tax) / 100;
        const total = subtotal + taxAmount;

        // परिणाम दिखाएं और एनिमेशन ट्रिगर करें
        const resultDisplay = document.getElementById('result-display');
        const resultAmount = document.getElementById('result-amount');

        // भारतीय मुद्रा प्रारूप (Indian Currency Format) में बदलें
        const formattedTotal = total.toLocaleString('en-IN', {
            style: 'currency',
            currency: 'INR',
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

        // परिणाम सेट करें (सिंबल के साथ)
        resultAmount.innerText = formattedTotal;
        
        // परिणाम बॉक्स दिखाएं
        resultDisplay.classList.add('show');
    }
</script>

</body>
</html>
